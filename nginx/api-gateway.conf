worker_processes 1;

events { worker_connections 1024; }

http {
    upstream service1 {
        server service1-1:8199;
        server service1-2:8199;
        server service1-3:8199;
    }

    server {
        listen 8200;

        # Route to Service1 instances for the /request endpoint
        location /request {
            proxy_pass http://service1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct /stop to one instance of Service1
        location /stop {
            proxy_pass http://service1-1:8199/stop;
            proxy_set_header Host $host;
        }

        # Restrict /state route to authenticated users for changing state
        location /state {
            proxy_pass http://service1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Apply authentication for PUT requests
            if ($request_method = PUT) {
                auth_basic "Restricted State Change";
                auth_basic_user_file /etc/nginx/.htpasswd;
            }
        }

        # Proxy /run-log to Service1
        location /run-log {
            proxy_pass http://service1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
