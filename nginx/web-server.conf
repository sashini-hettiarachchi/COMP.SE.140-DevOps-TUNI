worker_processes 1;

events { worker_connections 1024; }

http {
    server {
        listen 8197;

        # Serve the frontend HTML page
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }

        # Serve static assets (optional, adjust as needed)
        location /assets/ {
            root /usr/share/nginx/html/assets;
        }
    }
}
